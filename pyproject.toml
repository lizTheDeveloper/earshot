[project]
name = "earshot"
version = "0.1.0"
description = "Leave it listening: notices when a small drone is nearby, keeps no audio"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "lizTheDeveloper" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "sounddevice>=0.5",
]

[project.scripts]
earshot = "earshot.cli:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
